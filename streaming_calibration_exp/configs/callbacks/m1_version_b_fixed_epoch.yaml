# Version-B checkpoint policy: fixed final epoch only; no target-query model
# selection.  The train entry point evaluates the current final weights.
override_epoch_step:
  _target_: src.callbacks.override_epoch_step.OverrideEpochStepCallback
early_stopping: null
lr_monitor:
  _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: epoch
model_summary:
  _target_: lightning.pytorch.callbacks.RichModelSummary
  max_depth: -1
fixed_last_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints/fixed_last
  filename: epoch_{epoch:03d}
  monitor: null
  save_last: false
  save_top_k: -1
  every_n_epochs: 12
