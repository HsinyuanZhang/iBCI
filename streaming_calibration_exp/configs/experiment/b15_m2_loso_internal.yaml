# @package _global_

defaults:
  - override /model: streaming_b15

run_id: b15_m2_loso_internal
comparison_role: attention_full_internal_control
tags: ["b15", "m2", "loso", "internal-selection", "attention-full"]

data:
  validation_protocol: loso
  loso_fold: 1
  include_heldout_in_fit: false
  include_heldout_in_test: false

model:
  hidden_dim: 64
  freeze_decoder: true
  loss_mode: task_plus_y_plus_E
  lambda_y: 1.0
  lambda_E: 0.1

trainer:
  max_epochs: 20

callbacks:
  early_stopping:
    patience: 5
