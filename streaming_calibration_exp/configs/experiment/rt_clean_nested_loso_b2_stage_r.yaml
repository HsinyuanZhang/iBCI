# @package _global_

# Stage-R B2/LatePool reference.  This is intentionally a clean nested-LOSO
# fit configuration: outer-session target data is unavailable to Trainer.fit,
# and the separate one-shot evaluator must consume the selection receipt.
defaults:
  - override /data: rt_nested_loso_m24
  - override /model: streaming_b2

task: rt
run_id: rt_clean_nested_loso_m24_b2_stage_r
tags: ["rt", "stage_r", "b2", "clean_nested_loso", "m24", "source_only_selection", "development_only"]

train: true
test: false
no_early_stopping: true
require_baseline_validation: false
optimized_metric: val_heldin/r2_mean

data:
  # B2 consumes the neural calibration trials directly; no AFC4, velocity, or
  # side-feature tensor is present.  The side-feature group is nevertheless
  # explicit so the shared nested loader records a complete arm identity.
  side_feature_group: none
  loso_fold: 0

model:
  task: rt
  # Stage R compares the identity mechanism, not decoder freezing or loss.
  # This exactly matches the existing clean R-C/R-C0 source-fit schedule.
  freeze_decoder: false
  loss_mode: task_only
  lambda_y: 0.0
  lambda_E: 0.0
  # R-S (SPINT-scale); R-S128 is a command-line override of this field.
  id_hidden_dim: 1024

trainer:
  max_epochs: 35

callbacks:
  rt_nested_selection_receipt:
    _target_: src.callbacks.rt_nested_selection_receipt.RtNestedSelectionReceipt
    output_path: ${paths.output_dir}/rt_nested_selection_receipt.json
    split_manifest_path: ${paths.output_dir}/split_manifest.json
    config_path: ${paths.output_dir}/.hydra/config.yaml
    run_id: ${run_id}
    arm: ${data.side_feature_group}
    outer_loso_fold: ${data.outer_loso_fold}
    seed: ${seed}
    monitor: val_heldin/r2_mean
