# @package _global_
# Official H1 teacher composition; GPU execution remains gate-controlled.

defaults:
  - override /data: falcon_h1_teacher_clean_nested_loso
  - override /model: falcon_h1_teacher
  - override /callbacks: h1_clean_nested_loso

task: h1
run_id: h1_afc4_teacher_clean_nested_loso
tags: [h1, afc4, teacher, clean_nested_loso, development_only]
train: true
test: false
no_early_stopping: false
require_baseline_validation: false
optimized_metric: null

trainer:
  max_epochs: 100
  min_epochs: 20
  accelerator: gpu
  devices: 1
  precision: 32-true
  deterministic: true
  limit_val_batches: 1.0

callbacks:
  h1_selection_monitor:
    role: teacher
