# @package _global_

defaults:
  - override /model: streaming_b16

run_id: b16_m2_loso
comparison_role: mua_architecture_reuse_primary
tags: ["b16", "m2", "loso", "heldout", "high-order-stats"]

data:
  validation_protocol: loso
  loso_fold: 0
  include_heldout_in_fit: false
  include_heldout_in_test: true

model:
  hidden_dim: 64
  freeze_decoder: true
  loss_mode: task_plus_y_plus_E
  lambda_y: 1.0
  lambda_E: 0.1

trainer:
  max_epochs: 20

callbacks:
  early_stopping:
    patience: 5
