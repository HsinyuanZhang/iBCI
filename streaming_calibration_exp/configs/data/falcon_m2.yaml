_target_: src.data.falcon_datamodule.FalconDataModule

task: m2
data_dir: ${paths.data_dir}/000953/
heldin_session_names: ['']
batch_size: 32
window_size: 50
calibration_n_trials: 33

random_calibration: true
smooth_calibration: false
max_trial_length: 100
standardize_covariates: false
use_intertrials: true
use_calib_intertrials: false
trial_feature_type: raw
interpolate_trials: true
interpolate_trials_kind: cubic
pad_value: -1.0
validation_protocol: minival  # minival | loso | rotation_5_2
loso_fold: null
rotation_id: 0
include_heldout_in_fit: false
include_heldout_in_test: false
# Nonzero only for an explicit local held-out test-only replay.  It excludes
# every query window whose 50-bin history could touch the calibration prefix.
query_start_trial: 0
# False for ordinary held-out replays.  A correction-only protocol may set this
# true to record a session with no trial after the fixed support prefix as
# ineligible, never as an evaluable score.
allow_empty_heldout_query: false
num_workers: 4
pin_memory: true
sampler_seed: ${seed}
balance_session_batches: false
reshuffle_train_sampler_each_epoch: false
side_feature_group: none          # none | t4 | ts4; T4 reads held-in calibration trials only
side_feature_shuffle_seed: ${seed}
