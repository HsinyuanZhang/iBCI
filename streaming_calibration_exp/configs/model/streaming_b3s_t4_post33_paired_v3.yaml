_target_: src.models.streaming_post33_paired_t4_v3_module.M2Post33PairedT4LitModuleV3

task: m2
variant: B3S
paired_spint_completion_receipt: ???
loso_fold: ${data.loso_fold}
seed: ${seed}
teacher_receipt_path: null
require_clean_teacher_receipt: false
window_size: ${data.window_size}
trial_length: ${data.max_trial_length}
pad_value: ${data.pad_value}
freeze_decoder: true
encoder_warmstart_path: null
freeze_encoder_base: false
tune_encoder_fusion: false
fusion_mean_lr_scale: 1.0
