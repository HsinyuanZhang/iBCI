# Shared optimizer defaults for streaming calibration models
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-4
  weight_decay: 0.0

scheduler: null
compile: false

task: m2
teacher_ckpt_path: ${paths.teacher_ckpt_path}
teacher_receipt_path: null
require_clean_teacher_receipt: false
window_size: ${data.window_size}
trial_length: ${data.max_trial_length}
pad_value: ${data.pad_value}
freeze_decoder: true
# Plain tensor state for either a paired B3 anchor or the exact selected encoder variant.
encoder_warmstart_path: null
freeze_encoder_base: false
tune_encoder_fusion: false
fusion_mean_lr_scale: 1.0
loss_mode: task_plus_y_plus_E
lambda_y: 1.0
lambda_E: 0.1
decode_last_timestep_only: true
predict_scaled_behavior: true
behavior_scaling_factor: 5.0

id_hidden_dim: 128
hidden_dim: 64
num_emas: 4
num_filters: 4
kernel_size: 5
learnable_ema_alpha: false

# Structured neuron dropout to simulate chronic electrode degradation.
# Range is hard-capped at 0.3 (MAX_NEURON_DROPOUT_P) to preserve primary information.
neuron_dropout_mode: none        # none | uniform | block | curriculum | curriculum_block
neuron_dropout_p_low: 0.0
neuron_dropout_p_high: 0.3       # HARD CAP at 30%
neuron_dropout_block_size: 4     # only used by block / curriculum_block
neuron_dropout_warmup_epochs: 10 # only used by curriculum / curriculum_block
support_prediction_consistency_weight: 0.0
