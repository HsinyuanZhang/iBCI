model:
  _target_: src.models.streaming_calibration_module.StreamingCalibrationLitModule
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0001
    weight_decay: 0.0
  scheduler: null
  compile: false
  task: m1
  teacher_ckpt_path: ${paths.m1_teacher_ckpt_path}
  window_size: ${data.window_size}
  trial_length: ${data.max_trial_length}
  pad_value: ${data.pad_value}
  freeze_decoder: true
  loss_mode: task_plus_y_plus_E
  lambda_y: 1.0
  lambda_E: 0.1
  decode_last_timestep_only: true
  predict_scaled_behavior: false
  behavior_scaling_factor: 1.0
  id_hidden_dim: 128
  hidden_dim: 64
  num_emas: 4
  num_filters: 4
  kernel_size: 5
  learnable_ema_alpha: false
  sparsity_k: 16
  neuron_dropout_mode: none
  neuron_dropout_p_low: 0.0
  neuron_dropout_p_high: 0.3
  neuron_dropout_block_size: 4
  neuron_dropout_warmup_epochs: 10
  variant: B3S
  side_dim: 4
  electrode_embed_dim: 0
  num_electrodes: 0
model/params/total: 0
model/params/trainable: 0
model/params/non_trainable: 0
data:
  _target_: src.data.falcon_datamodule.FalconDataModule
  task: m1
  data_dir: ${paths.data_dir}/000941/
  heldin_session_names:
  - ''
  batch_size: 32
  window_size: 100
  calibration_n_trials: 10
  random_calibration: false
  smooth_calibration: false
  max_trial_length: 1024
  standardize_covariates: false
  use_intertrials: true
  use_calib_intertrials: false
  trial_feature_type: raw
  interpolate_trials: true
  interpolate_trials_kind: cubic
  pad_value: -1.0
  validation_protocol: loso
  loso_fold: 1
  rotation_id: 0
  include_heldout_in_fit: false
  include_heldout_in_test: false
  query_start_trial: 0
  heldin_query_start_trial: 210
  heldin_query_end_trial: null
  allow_empty_heldout_query: false
  num_workers: 0
  pin_memory: true
  sampler_seed: ${seed}
  balance_session_batches: false
  reshuffle_train_sampler_each_epoch: false
  side_feature_group: t4
  side_feature_shuffle_seed: ${seed}
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 12
  gradient_clip_val: 0.0
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  deterministic: false
  log_every_n_steps: 10
callbacks:
  override_epoch_step:
    _target_: src.callbacks.override_epoch_step.OverrideEpochStepCallback
  early_stopping: null
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  best_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints/best_ckpt
    filename: epoch_{epoch:03d}
    monitor: val_heldin/r2_mean
    mode: max
    save_last: true
    auto_insert_metric_name: false
    save_top_k: 3
  periodic_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints/periodic_ckpt
    filename: epoch_{epoch:03d}
    monitor: val_heldin/r2_mean
    mode: max
    save_last: true
    auto_insert_metric_name: false
    every_n_epochs: 10
    save_top_k: -1
extras:
  ignore_warnings: false
  enforce_tags: false
  print_config: true
