task_name: train
tags:
- native-mua
- b3s
- t4
- m2
- loso
- internal-only
- m24-b3ts-matched
train: false
test: true
ckpt_path: /home/xinyuan/Work_host/SPINT/streaming_calibration_exp/outputs/streaming_calibration/m2_m24_b3ts_t4_v1_source_t4_m2_f1_s42_20260731_225540/checkpoints/best.ckpt
seed: 42
run_id: p1_redo_anchor_m2_t4_full_cpu
comparison_role: null
no_early_stopping: true
optimized_metric: null
baseline_metrics_path: ${paths.artifact_dir}/b0_baseline/metrics_per_session.csv
require_baseline_validation: false
data:
  _target_: src.data.falcon_datamodule.FalconDataModule
  task: m2
  data_dir: ${paths.data_dir}/000953/
  heldin_session_names:
  - ''
  batch_size: 32
  window_size: 50
  calibration_n_trials: 24
  random_calibration: false
  smooth_calibration: false
  max_trial_length: 100
  standardize_covariates: false
  use_intertrials: true
  use_calib_intertrials: false
  trial_feature_type: raw
  interpolate_trials: true
  interpolate_trials_kind: cubic
  pad_value: -1.0
  validation_protocol: loso
  loso_fold: 1
  rotation_id: 0
  include_heldout_in_fit: false
  include_heldout_in_test: true
  query_start_trial: 24
  allow_empty_heldout_query: false
  num_workers: 0
  pin_memory: true
  sampler_seed: ${seed}
  balance_session_batches: false
  reshuffle_train_sampler_each_epoch: false
  side_feature_group: t4
  side_feature_shuffle_seed: ${seed}
model:
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.0001
    weight_decay: 0.0
  scheduler: null
  compile: false
  task: m2
  teacher_ckpt_path: ${paths.teacher_ckpt_path}
  teacher_receipt_path: null
  require_clean_teacher_receipt: false
  window_size: ${data.window_size}
  trial_length: ${data.max_trial_length}
  pad_value: ${data.pad_value}
  freeze_decoder: true
  encoder_warmstart_path: null
  freeze_encoder_base: false
  tune_encoder_fusion: false
  fusion_mean_lr_scale: 1.0
  loss_mode: task_plus_y_plus_E
  lambda_y: 1.0
  lambda_E: 0.1
  decode_last_timestep_only: true
  predict_scaled_behavior: true
  behavior_scaling_factor: 5.0
  id_hidden_dim: 128
  hidden_dim: 64
  num_emas: 4
  num_filters: 4
  kernel_size: 5
  learnable_ema_alpha: false
  neuron_dropout_mode: none
  neuron_dropout_p_low: 0.0
  neuron_dropout_p_high: 0.3
  neuron_dropout_block_size: 4
  neuron_dropout_warmup_epochs: 10
  support_prediction_consistency_weight: 0.0
  _target_: src.models.streaming_calibration_module.StreamingCalibrationLitModule
  variant: B3S
  side_dim: 4
  electrode_embed_dim: 0
  num_electrodes: 0
callbacks:
  override_epoch_step:
    _target_: src.callbacks.override_epoch_step.OverrideEpochStepCallback
  early_stopping: null
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  best_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints/best_ckpt
    filename: epoch_{epoch:03d}
    monitor: val_heldin/r2_mean
    mode: max
    save_last: true
    auto_insert_metric_name: false
    save_top_k: 3
  periodic_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints/periodic_ckpt
    filename: epoch_{epoch:03d}
    monitor: val_heldin/r2_mean
    mode: max
    save_last: true
    auto_insert_metric_name: false
    every_n_epochs: 10
    save_top_k: -1
logger:
  _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
  save_dir: ${paths.output_dir}
  name: ''
  version: ''
  log_graph: false
  default_hp_metric: true
  prefix: ''
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 12
  gradient_clip_val: 0.0
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  deterministic: false
  log_every_n_steps: 10
paths:
  root_dir: .
  data_dir: ${paths.root_dir}/../SPINT-main/data/
  log_dir: /home/xinyuan/Work_host/SPINT/sua_exploration/p1_redo_anchored_20260809/m2_scratch/logs
  artifact_dir: /home/xinyuan/Work_host/SPINT/sua_exploration/p1_redo_anchored_20260809/m2_scratch/artifacts
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  teacher_ckpt_path: ${paths.root_dir}/../SPINT-main/logs/train/runs/2026-07-07-16-05-16/checkpoints/best_ckpt/epoch_034.ckpt
  m1_teacher_ckpt_path: ${paths.root_dir}/../SPINT-main/logs/train/runs/2026-07-21-19-11-01/checkpoints/best_ckpt/epoch_019.ckpt
extras:
  ignore_warnings: false
  enforce_tags: false
  print_config: true
