# @package _global_
#
# Deliberately non-runnable until a human supplies one immutable five-date
# aggregate, one exact source-date preflight, and an explicit outer-date
# override through the receipt-only launcher.  This configuration has no
# target evaluator and is never a formal held-out endpoint by itself.
defaults:
  - override /data: falcon_h1_carrierid_date_lodo_ci
  - override /model: falcon_h1_carrierid_date_lodo_ci32_full
  - override /callbacks: h1_carrierid_date_lodo_phase2_terminal

protocol_id: h1_carrierid_date_lodo_ci32_full_${phase_ci.outer_date}_source_only_v1
task_name: h1_carrierid_date_lodo_ci32_full_${phase_ci.outer_date}
tags: [h1, carrierid, date_lodo, ci32, full, source_only, seed42, e49]
seed: 42
train: true
test: false
ckpt_path: null
logger: false

phase_ci:
  outer_date: "__REQUIRED_EXPLICIT_OUTER_DATE__"
  arm: CI32-FULL
  carrier_intervention: full
  phase1_preflight_path: ${paths.work_dir}/pilot_artifacts/h1_carrierid_date_lodo_phase1/H1_CARRIERID_DATE_LODO_SOURCE_PREFLIGHT_v1.json
  ci_preflight_path: "__REQUIRED_IMMUTABLE_CI_SOURCE_PREFLIGHT_PATH__"
  five_date_aggregate_path: "__REQUIRED_IMMUTABLE_FIVE_DATE_AGGREGATE_PATH__"
  warm_start_forbidden: true
  target_evaluator_status: IMPLEMENTED_NOT_RUN_TARGET_GATE_CLOSED

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 50
  min_epochs: 50
  precision: 32-true
  deterministic: false
  enable_checkpointing: true
  limit_val_batches: 0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
