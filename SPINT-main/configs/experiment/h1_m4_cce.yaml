# @package _global_
defaults:
  - override /data: falcon_h1_m4_cce
  - override /model: falcon_h1_m4_cce
  - override /callbacks: h1_m4_cce_terminal

protocol_id: h1_m4_cce_date_lodo_confirmatory_v1
task_name: h1_m4_cce_joint
tags: [h1, m4, cce, date_lodo, confirmatory, joint]
seed: 42
train: true
test: false
ckpt_path: null
clean_teacher_mode: false
optimized_metric: null
logger: false

pilot:
  # Must be overridden by the paired launcher with one of the five frozen dates.
  fold_date: "19250108"
  arm: joint
  train_residual: true
  shared_cache_dir: ${paths.work_dir}/pilot_artifacts/h1_m4_cce_date_lodo/shared_source_cache/19250108/joint
  calibration_n_trials: 4
  batch_size: 32
  fixed_terminal_epochs: 50
  no_checkpoint_selection: true
  blend_alpha_fixed: 0.5

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 50
  min_epochs: 50
  precision: 32-true
  deterministic: false
  enable_checkpointing: true
  limit_val_batches: 0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
