# @package _global_
# Shared exploratory contract.  The paired launcher uses the explicit base and
# joint configs below; this name remains a joint-arm convenience alias.
defaults:
  - override /data: falcon_h1_m4_eb_fold0_pilot
  - override /model: falcon_h1_m4_eb_pilot
  - override /callbacks: h1_m4_eb_pilot_terminal

protocol_id: h1_m4_eb_carrier_fold0_exploratory_system_pilot_v1
task_name: h1_m4_eb_fold0_joint
tags: [h1, m4, eb_carrier, fold0, exploratory, joint]
seed: 42
train: true
test: false
ckpt_path: null
clean_teacher_mode: false
optimized_metric: null
logger: false

pilot:
  fold_date: "19250101"
  arm: joint
  train_residual: true
  shared_cache_dir: ${paths.work_dir}/pilot_artifacts/h1_m4_eb_fold0/shared_cache
  calibration_n_trials: 4
  batch_size: 32
  fixed_terminal_epochs: 50
  no_checkpoint_selection: true

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 50
  min_epochs: 50
  precision: 32-true
  deterministic: false
  enable_checkpointing: true
  limit_val_batches: 0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
