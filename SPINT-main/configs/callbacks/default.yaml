defaults:
  - override_epoch_step
  - early_stopping
  - lr_monitor
  - model_summary
  - _self_


best_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints/best_ckpt
  filename: "epoch_{epoch:03d}"
  monitor: "val_heldout/r2_mean"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

  save_top_k: 5
  every_n_epochs: null

periodic_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints/periodic_ckpt
  filename: "epoch_{epoch:03d}"
  monitor: "val_heldout/r2_mean"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False
  
  every_n_epochs: 10
  save_top_k: -1

early_stopping:
  monitor: "val_heldout/r2_mean"
  patience: 3000
  mode: "max"

model_summary:
  max_depth: -1
