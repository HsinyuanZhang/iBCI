_target_: src.models.h1_spint_width_module.H1SpintWidthLitModule
task: h1
width_arm: ${width_sweep.arm}
fold_date: ${width_sweep.fold_date}
fixed_seed: 42
decode_last_timestep_only: true
predict_scaled_behavior: true
behavior_scaling_factor: 20.0
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 5.0e-5
  weight_decay: 0.0
scheduler: null
compile: false
clean_teacher: true
scheduler_monitor: val_heldin/r2_mean
net:
  _target_: src.models.components.spint_identity_width.SpintIdentityWidthModel
  model_dim: 1024
  num_covariates: 7
  window_size: 700
  identity_width: ${width_sweep.identity_width}
  num_heads: 64
  num_layers: 1
  num_id_layers: 3
  use_learnable_id: true
  learnable_id_type: mlp
  learnable_rep: true
  dropout_rate: 0.0
  dynamic_dropout: true
  dynamic_dropout_low: 0.0
  dynamic_dropout_high: 1.0
  tf_drop_rate: 0.1
  readin_layer_type: mlp
