_target_: src.models.h1_carrierid_date_lodo_hls_module.H1CarrierIdDateLodoHlsLitModule
task: h1
arm: H-LS
outer_date: ${phase2.outer_date}
fixed_seed: 42
decode_last_timestep_only: true
predict_scaled_behavior: true
behavior_scaling_factor: 20.0
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 5.0e-5
  weight_decay: 0.0
scheduler: null
compile: false
clean_teacher: true
scheduler_monitor: val_heldin/r2_mean
net:
  _target_: src.models.components.h1_carrierid_spint.H1CarrierIdSpint
  carrier_hidden_dim: 32
  carrier_dim: 4
  carrier_trial_length: 1024
  zero_carrier: false
  model_dim: 1024
  num_covariates: 7
  window_size: 700
  num_heads: 64
  num_layers: 1
  num_id_layers: 3
  use_learnable_id: true
  learnable_id_type: mlp
  learnable_rep: true
  dropout_rate: 0.0
  dynamic_dropout: true
  dynamic_dropout_low: 0.0
  dynamic_dropout_high: 1.0
  tf_drop_rate: 0.1
  readin_layer_type: mlp
