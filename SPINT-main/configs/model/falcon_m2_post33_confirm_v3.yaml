_target_: src.models.falcon_post33_confirm_v3_module.M2Post33SourceOnlyFalconLitModule

task: m2
loso_fold: ${data.loso_fold}
decode_last_timestep_only: true
predict_scaled_behavior: true
behavior_scaling_factor: 5.0

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 5e-5
  weight_decay: 0.0

scheduler: null
scheduler_monitor: val_source/r2_equal_session_mean

net:
  _target_: src.models.components.spint.SpintModel
  model_dim: 512
  num_covariates: 2
  window_size: ${data.window_size}
  num_heads: 64
  num_layers: 1
  num_id_layers: 3
  use_learnable_id: true
  learnable_id_type: mlp
  learnable_rep: true
  dropout_rate: 0.0
  dynamic_dropout: true
  dynamic_dropout_low: 0.0
  dynamic_dropout_high: 1.0
  tf_drop_rate: 0.1
  readin_layer_type: mlp

compile: false
clean_teacher: false

